name: CI Pipeline

on:
 push:
  branches: [ main ] # Only runs on push to our main 

jobs:
 build:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v5 # This is a predefined checkout in git actions that checks out for us

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with: 
       node-version: 16
    
    - name: Install dependencies
      run: npm Install

    - name: Run test
      run: npm test
